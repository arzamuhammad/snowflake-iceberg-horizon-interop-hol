# Trino Iceberg connector -> Snowflake Horizon Iceberg REST Catalog
# File: etc/catalog/horizon.properties   (query as horizon.<schema>.<table>)
#
# Scope: UNPROTECTED tables (RBAC is enforced, masking / row access are not, because
# Trino does not call the Horizon Scan Plan API). For protected data publish a
# purpose-built table (see sql/05_aws_share_database.sql) or use Spark / Databricks.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=https://${ENV:SNOWFLAKE_ACCOUNT}.snowflakecomputing.com/polaris/api/catalog
iceberg.rest-catalog.warehouse=GROUP_LAKEHOUSE
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.credential=${ENV:SNOWFLAKE_PAT}
iceberg.rest-catalog.oauth2.scope=session:role:GROUP_DBX_READER
iceberg.rest-catalog.vended-credentials-enabled=true
# Snowflake identifiers are upper case
iceberg.rest-catalog.case-insensitive-name-matching=true
fs.native-s3.enabled=true
s3.region=${ENV:AWS_REGION}
